[Kerberoasting - RC4 Service Ticket Request]
search = index=wineventlog EventCode=4769 Ticket_Encryption_Type=0x17 Service_Name!="*$" \
| stats count min(_time) as firstTime max(_time) as lastTime values(Service_Name) as services by Account_Name, Client_Address \
| convert ctime(firstTime) ctime(lastTime) \
| where count > 0
dispatch.earliest_time = -60m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert.track = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
counttype = number of events
quantity = 0
relation = greater than
description = Detects RC4 service ticket requests, a Kerberoasting indicator. Baseline uses AES (0x12) exclusively. Lab runs a 60-minute window for manual testing; production would run tighter, e.g. 15 minutes aligned to the schedule interval.
